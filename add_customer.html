{% extends "base.html" %}

{% block content %}

<div class="card shadow p-4">

    <h2 class="mb-4">Add New Customer</h2>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Customer Name</label>
            <input type="text" name="name" class="form-control" placeholder="Enter customer name" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="text" name="phone" class="form-control" placeholder="Enter phone number">
        </div>

        <div class="mb-3">
            <label class="form-label">Address</label>
            <textarea name="address" class="form-control" rows="3" placeholder="Enter address"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Opening Balance</label>
            <input type="number" name="opening_balance" class="form-control" placeholder="Enter opening balance">
        </div>

        <div class="mb-3">
            <label class="form-label">Notes</label>
            <textarea name="notes" class="form-control" rows="3" placeholder="Additional notes"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">
            Save Customer
        </button>

        <a href="/customers" class="btn btn-secondary">
            Back
        </a>

    </form>

</div>

{% endblock %}
